<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create / Edit Quiz - QMS</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <nav>
    <a href="index.html" class="brand">⚡ Quiz Management System</a>
    <a href="index.html">← Dashboard</a>
  </nav>

  <div class="container">
    <div class="card" style="border-top: 5px solid #4f46e5;">
      <h2 id="pageTitle" style="margin-bottom:1rem;">Create Cloud Quiz</h2>
      
      <label><b>Quiz Title *</b></label>
      <input type="text" id="titleInput" placeholder="e.g. CS101 Midterm Survey">

      <label><b>Description</b></label>
      <textarea id="descInput" rows="2" placeholder="Brief description..."></textarea>

      <div style="display:flex; gap:15px; flex-wrap:wrap;">
        <div style="flex:1; min-width:200px;">
          <label><b>Category</b></label>
          <select id="categoryInput">
            <option value="General">General</option>
            <option value="Academic Quiz">Academic Quiz</option>
            <option value="Data Survey">Data Survey</option>
            <option value="Feedback">Feedback</option>
          </select>
        </div>
        <div style="flex:1; min-width:200px;">
          <label><b>Protection Password (Optional)</b></label>
          <input type="text" id="passwordInput" placeholder="Leave blank for public edit/export">
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Quiz Fields & Questions</h3>
      <div id="fieldsContainer"></div>
      <button onclick="addField()" class="btn btn-secondary" style="margin-top:10px;">+ Add Question Field</button>
    </div>

    <button onclick="saveQuiz()" class="btn-create" style="width:100%; justify-content:center; padding:12px;">Save Quiz to Cloud</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://tbkkjhiuhoqrnglhmcbb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRia2tqaGl1aG9xcm5nbGhtY2JiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4NTMxMzMsImV4cCI6MjExMDQyOTEzM30.OqiZYL2qUFbDvVkWb7usax0F4Ej8OVpGidEz8XkoJOA';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('id') ? Number(urlParams.get('id')) : null;
    let fields = [];

    async function init() {
      if (editId) {
        document.getElementById('pageTitle').innerText = 'Edit Cloud Quiz';
        const { data: quiz } = await supabase.from('quizzes').select('*').eq('id', editId).single();
        if (quiz) {
          document.getElementById('titleInput').value = quiz.title;
          document.getElementById('descInput').value = quiz.description || '';
          document.getElementById('categoryInput').value = quiz.category || 'General';
          document.getElementById('passwordInput').value = quiz.password || '';
          fields = quiz.fields || [];
          renderFields();
        }
      } else {
        addField();
      }
    }

    function addField() {
      fields.push({ label: '', type: 'text', required: true, options: ['Option 1'] });
      renderFields();
    }

    function removeField(i) {
      fields.splice(i, 1);
      renderFields();
    }

    function updateField(i, key, val) {
      fields[i][key] = val;
      if (key === 'type' && (val === 'radio' || val === 'checkbox' || val === 'rating') && !fields[i].options) {
        fields[i].options = ['Option 1'];
      }
      renderFields();
    }

    function addOption(fIdx) {
      fields[fIdx].options.push(`Option ${fields[fIdx].options.length + 1}`);
      renderFields();
    }

    function updateOption(fIdx, oIdx, val) {
      fields[fIdx].options[oIdx] = val;
    }

    function removeOption(fIdx, oIdx) {
      fields[fIdx].options.splice(oIdx, 1);
      renderFields();
    }

    function renderFields() {
      const container = document.getElementById('fieldsContainer');
      container.innerHTML = '';
      fields.forEach((f, idx) => {
        const box = document.createElement('div');
        box.className = 'card';
        box.style.background = '#f8fafc';
        
        let optionsHTML = '';
        if (f.type === 'radio' || f.type === 'checkbox' || f.type === 'rating') {
          let opts = f.options || [];
          optionsHTML = `<div style="margin-top:8px;"><label style="font-size:12px; font-weight:700;">Options:</label>`;
          opts.forEach((opt, oIdx) => {
            optionsHTML += `
              <div style="display:flex; gap:6px; margin-top:4px;">
                <input type="text" value="${opt}" oninput="updateOption(${idx}, ${oIdx}, this.value)" style="margin:0;">
                <button onclick="removeOption(${idx}, ${oIdx})" class="btn btn-danger" style="padding:4px 8px;">✕</button>
              </div>`;
          });
          optionsHTML += `<button onclick="addOption(${idx})" class="btn btn-secondary" style="margin-top:6px; font-size:12px;">+ Add Option</button></div>`;
        }

        box.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <b>Question #${idx + 1}</b>
            <button onclick="removeField(${idx})" class="btn btn-danger" style="padding:4px 8px; font-size:12px;">Delete Question</button>
          </div>
          <input type="text" placeholder="Question label / prompt..." value="${f.label}" oninput="updateField(${idx}, 'label', this.value)">
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <div style="flex:1;">
              <label style="font-size:12px;">Answer Type:</label>
              <select onchange="updateField(${idx}, 'type', this.value)">
                <option value="text" ${f.type==='text'?'selected':''}>Short Text</option>
                <option value="paragraph" ${f.type==='paragraph'?'selected':''}>Paragraph</option>
                <option value="number" ${f.type==='number'?'selected':''}>Number</option>
                <option value="radio" ${f.type==='radio'?'selected':''}>Multiple Choice (Radio)</option>
                <option value="checkbox" ${f.type==='checkbox'?'selected':''}>Checkboxes</option>
                <option value="rating" ${f.type==='rating'?'selected':''}>Rating Scale (1-5)</option>
              </select>
            </div>
            <div style="flex:1; display:flex; align-items:flex-end;">
              <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin-bottom:14px;">
                <input type="checkbox" ${f.required !== false ? 'checked' : ''} onchange="updateField(${idx}, 'required', this.checked)" style="width:16px; height:16px; margin:0;"> Required
              </label>
            </div>
          </div>
          ${optionsHTML}
        `;
        container.appendChild(box);
      });
    }

    async function saveQuiz() {
      const title = document.getElementById('titleInput').value.trim();
      if (!title) return alert('Please enter a quiz title.');
      if (fields.length === 0) return alert('Add at least one question field.');

      const quizData = {
        id: editId || Date.now(),
        title,
        description: document.getElementById('descInput').value.trim(),
        category: document.getElementById('categoryInput').value,
        password: document.getElementById('passwordInput').value.trim(),
        fields
      };

      const { error } = await supabase.from('quizzes').upsert(quizData);
      if (error) {
        alert('Error saving to cloud database: ' + error.message);
        return;
      }

      if (!editId) {
        let myIds = JSON.parse(localStorage.getItem('qms_my_quiz_ids')) || [];
        myIds.push(quizData.id);
        localStorage.setItem('qms_my_quiz_ids', JSON.stringify(myIds));
      }

      window.location.href = 'index.html';
    }

    init();
  </script>
</body>
</html>
