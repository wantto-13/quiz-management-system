<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Studio - Quiz Management System</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .builder-header-card {
      border-top: 5px solid #4f46e5;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 640px) {
      .meta-grid { grid-template-columns: 1fr; }
    }
    .field-card {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-left: 4px solid #4f46e5;
      border-radius: 12px;
      padding: 1.4rem;
      margin-bottom: 1.2rem;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.03);
      transition: all 0.2s ease;
    }
    .field-card:hover {
      border-color: #cbd5e1;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
    }
    .field-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f1f5f9;
    }
    .q-badge {
      background: #eef2ff;
      color: #4f46e5;
      font-weight: 800;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .field-actions button {
      padding: 5px 10px;
      font-size: 12px;
      margin: 0 0 0 4px;
    }
    .field-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 640px) {
      .field-grid { grid-template-columns: 1fr; }
    }
    .option-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .option-row input {
      margin: 0;
    }
    .field-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed #e2e8f0;
    }
    .toggle-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
    }
    .toggle-wrap input {
      accent-color: #4f46e5;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .sticky-toolbar {
      position: sticky;
      bottom: 16px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.25);
      z-index: 50;
    }
    textarea {
      width: 100%;
      padding: 10px 14px;
      margin: 6px 0 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 9px;
      font-size: 14px;
      resize: vertical;
      min-height: 70px;
    }
    textarea:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      z-index: 200;
      padding: 2rem 1rem;
      overflow-y: auto;
    }
    .modal-box {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="brand">⚡ Quiz Management System</a>
    <a href="index.html">← Back to Dashboard</a>
  </nav>

  <div class="container">
    <div class="card builder-header-card">
      <h2 id="studioHeading">Create New Quiz Studio</h2>
      <div class="meta-grid">
        <div>
          <label><b>Quiz / Database Table Title *</b></label>
          <input type="text" id="quizTitle" placeholder="e.g., BCA Semester 1 Tech Survey" required>
        </div>
        <div>
          <label><b>Category</b></label>
          <select id="quizCategory">
            <option value="General">General</option>
            <option value="Academic Quiz">Academic Quiz</option>
            <option value="Data Survey">Data Survey</option>
            <option value="Event Registration">Event Registration</option>
            <option value="Feedback">Feedback</option>
          </select>
        </div>
      </div>
      <label><b>Description / Instructions (Optional)</b></label>
      <textarea id="quizDesc" placeholder="Add brief instructions for participants..."></textarea>

      <!-- Password Protection at Bottom of Creation Card -->
      <div style="margin-top: 1rem; border-top: 1px dashed #e2e8f0; padding-top: 1rem;">
        <label><b>🔒 Protection Password for Edit & Table/CSV (Optional)</b></label>
        <input type="text" id="quizPassword" placeholder="Leave blank if you do not want a password">
        <small style="color:#64748b;">If set, users will need to enter this password to edit the quiz or view/export collected responses.</small>
      </div>
    </div>

    <div id="fieldsContainer"></div>

    <div class="sticky-toolbar">
      <div>
        <button type="button" class="btn btn-secondary" onclick="addField()">+ Add Question / Column</button>
        <button type="button" class="btn btn-info" onclick="openPreview()">👁 Live Preview</button>
      </div>
      <button type="button" class="btn-create" onclick="saveQuiz()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width:18px; height:18px; display:inline-block; vertical-align:middle; margin-right:4px;">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        <span id="saveBtnText">Publish Quiz to Cloud</span>
      </button>
    </div>
  </div>

  <div id="previewModal" class="modal-backdrop">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h2 style="margin:0;">👁 Form Preview</h2>
        <button type="button" class="btn btn-danger" onclick="closePreview()">✕ Close</button>
      </div>
      <div id="previewContent"></div>
    </div>
  </div>

  <script>
    const SHEETDB_URL = 'https://sheetdb.io/api/v1/q8x7kiy49blc5';
    const params = new URLSearchParams(window.location.search);
    const editQuizId = params.get('id') ? Number(params.get('id')) : null;
    let uidCounter = 0;

    async function init() {
      if (editQuizId) {
        try {
          const res = await fetch(`${SHEETDB_URL}/id/${editQuizId}?sheet=quizzes`);
          const data = await res.json();
          if (data && data.length > 0) {
            const existing = data[0];

            if (existing.password) {
              const pwd = prompt("Enter password to edit this quiz:");
              if (pwd !== existing.password) {
                alert("Incorrect password!");
                window.location.href = "index.html";
                return;
              }
            }

            document.getElementById('studioHeading').innerText = 'Edit Quiz Studio';
            document.getElementById('saveBtnText').innerText = 'Save Changes';
            
            document.getElementById('quizTitle').value = existing.title || '';
            document.getElementById('quizCategory').value = existing.category || 'General';
            document.getElementById('quizDesc').value = existing.description || '';
            document.getElementById('quizPassword').value = existing.password || '';
            
            const parsedFields = existing.fields ? JSON.parse(existing.fields) : [];
            if (Array.isArray(parsedFields) && parsedFields.length > 0) {
              parsedFields.forEach(f => addField(f));
            } else {
              addField();
            }
          } else {
            alert('Quiz not found for editing.');
            window.location.href = 'index.html';
          }
        } catch (e) {
          console.error('Error loading quiz:', e);
          alert('Could not load quiz from cloud.');
          window.location.href = 'index.html';
        }
      } else {
        addField({ label: 'Full Name', type: 'text', required: true, options: [] });
        addField({ label: 'Overall Rating', type: 'rating', required: true, options: ['1','2','3','4','5'] });
      }
    }

    function addField(preset = null) {
      uidCounter++;
      const id = uidCounter;
      const container = document.getElementById('fieldsContainer');

      const div = document.createElement('div');
      div.className = 'field-card';
      div.id = `card_${id}`;

      const labelVal = preset ? preset.label : '';
      const typeVal = preset ? preset.type : 'text';
      const reqVal = preset ? (preset.required !== false) : true;
      const opts = (preset && preset.options && preset.options.length)
        ? preset.options
        : ['Option 1', 'Option 2'];

      div.innerHTML = `
        <div class="field-top-bar">
          <span class="q-badge">COLUMN #1</span>
          <div class="field-actions">
            <button type="button" class="btn btn-secondary" title="Move Up" onclick="moveField(${id}, -1)">↑</button>
            <button type="button" class="btn btn-secondary" title="Move Down" onclick="moveField(${id}, 1)">↓</button>
            <button type="button" class="btn btn-secondary" title="Duplicate" onclick="duplicateField(${id})">❐ Copy</button>
            <button type="button" class="btn btn-danger" title="Delete" onclick="removeField(${id})">🗑</button>
          </div>
        </div>

        <div class="field-grid">
          <div>
            <label><b>Question / CSV Column Header *</b></label>
            <input type="text" class="f-label" value="${escapeAttr(labelVal)}" placeholder="e.g., Student Name, Roll No">
          </div>
          <div>
            <label><b>Data / Input Type</b></label>
            <select class="f-type" onchange="handleTypeChange(${id}, this.value)">
              <option value="text" ${typeVal === 'text' ? 'selected' : ''}>Short Text</option>
              <option value="paragraph" ${typeVal === 'paragraph' ? 'selected' : ''}>Long Paragraph</option>
              <option value="number" ${typeVal === 'number' ? 'selected' : ''}>Number</option>
              <option value="mcq" ${typeVal === 'mcq' ? 'selected' : ''}>Multiple Choice (Single)</option>
              <option value="checkbox" ${typeVal === 'checkbox' ? 'selected' : ''}>Checkboxes (Multi-Select)</option>
              <option value="rating" ${typeVal === 'rating' ? 'selected' : ''}>1 to 5 Rating Scale</option>
            </select>
          </div>
        </div>

        <div id="optsWrap_${id}" style="display:${(typeVal === 'mcq' || typeVal === 'checkbox') ? 'block' : 'none'}; margin-top:6px;">
          <label><b>Choices / Options</b></label>
          <div id="optList_${id}"></div>
          <button type="button" class="btn btn-secondary" style="font-size:12px; padding:6px 12px;" onclick="addOptionRow(${id}, '')">+ Add Option</button>
        </div>

        <div class="field-footer">
          <span style="font-size:12px; color:#64748b;" id="hint_${id}"></span>
          <label class="toggle-wrap">
            <input type="checkbox" class="f-req" ${reqVal ? 'checked' : ''}> Required Field
          </label>
        </div>
      `;

      container.appendChild(div);
      opts.forEach(o => addOptionRow(id, o));
      handleTypeChange(id, typeVal);
      renumberCards();
    }

    function addOptionRow(cardId, textVal) {
      const list = document.getElementById(`optList_${cardId}`);
      const row = document.createElement('div');
      row.className = 'option-row';
      row.innerHTML = `
        <input type="text" class="opt-input" value="${escapeAttr(textVal)}" placeholder="Option text...">
        <button type="button" class="btn btn-danger" style="margin:0; padding:8px 11px;" onclick="this.parentElement.remove()">✕</button>
      `;
      list.appendChild(row);
    }

    function handleTypeChange(cardId, type) {
      const wrap = document.getElementById(`optsWrap_${cardId}`);
      const hint = document.getElementById(`hint_${cardId}`);
      wrap.style.display = (type === 'mcq' || type === 'checkbox') ? 'block' : 'none';

      const hints = {
        text: 'Collects single-line text in CSV.',
        paragraph: 'Collects multi-line feedback in CSV.',
        number: 'Validates numeric input only.',
        mcq: 'Participant picks one option.',
        checkbox: 'Participant can pick multiple options.',
        rating: 'Displays 1★ to 5★ scale.'
      };
      hint.innerText = hints[type] || '';
    }

    function moveField(cardId, direction) {
      const card = document.getElementById(`card_${cardId}`);
      const container = document.getElementById('fieldsContainer');
      if (direction === -1 && card.previousElementSibling) {
        container.insertBefore(card, card.previousElementSibling);
      } else if (direction === 1 && card.nextElementSibling) {
        container.insertBefore(card.nextElementSibling, card);
      }
      renumberCards();
    }

    function duplicateField(cardId) {
      const card = document.getElementById(`card_${cardId}`);
      const data = extractCardData(card);
      addField(data);
    }

    function removeField(cardId) {
      const container = document.getElementById('fieldsContainer');
      if (container.children.length <= 1) {
        return alert('A quiz must have at least one question/column.');
      }
      document.getElementById(`card_${cardId}`).remove();
      renumberCards();
    }

    function renumberCards() {
      const cards = document.querySelectorAll('.field-card');
      cards.forEach((card, idx) => {
        card.querySelector('.q-badge').innerText = `COLUMN #${idx + 1}`;
      });
    }

    function extractCardData(card) {
      const label = card.querySelector('.f-label').value.trim();
      const type = card.querySelector('.f-type').value;
      const required = card.querySelector('.f-req').checked;
      let options = [];

      if (type === 'mcq' || type === 'checkbox') {
        card.querySelectorAll('.opt-input').forEach(inp => {
          if (inp.value.trim() !== '') options.push(inp.value.trim());
        });
      } else if (type === 'rating') {
        options = ['1', '2', '3', '4', '5'];
      }
      return { label, type, required, options };
    }

    function buildQuizObject() {
      const title = document.getElementById('quizTitle').value.trim();
      if (!title) {
        alert('Please enter a Quiz Title!');
        return null;
      }

      const cards = document.querySelectorAll('.field-card');
      if (cards.length === 0) {
        alert('Add at least one question!');
        return null;
      }

      const fields = [];
      for (let i = 0; i < cards.length; i++) {
        const item = extractCardData(cards[i]);
        if (!item.label) {
          alert(`Please enter a name/question for Column #${i + 1}.`);
          return null;
        }
        if ((item.type === 'mcq' || item.type === 'checkbox') && item.options.length < 2) {
          alert(`Column #${i + 1} ("${item.label}") needs at least 2 valid options.`);
          return null;
        }
        fields.push(item);
      }

      return {
        id: editQuizId ? editQuizId : Date.now(),
        title: title,
        category: document.getElementById('quizCategory').value,
        description: document.getElementById('quizDesc').value.trim(),
        password: document.getElementById('quizPassword').value.trim(),
        fields: JSON.stringify(fields)
      };
    }

    async function saveQuiz() {
      const quizObj = buildQuizObject();
      if (!quizObj) return;

      try {
        if (editQuizId) {
          await fetch(`${SHEETDB_URL}/id/${editQuizId}?sheet=quizzes`, {
            method: 'PUT',
            headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ data: quizObj })
          });
        } else {
          await fetch(`${SHEETDB_URL}?sheet=quizzes`, {
            method: 'POST',
            headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ data: quizObj })
          });
          
          let myIds = JSON.parse(localStorage.getItem('qms_my_quiz_ids')) || [];
          myIds.push(quizObj.id);
          localStorage.setItem('qms_my_quiz_ids', JSON.stringify(myIds));
        }

        window.location.href = 'index.html';
      } catch (err) {
        alert('Error saving to Google Sheet: ' + err.message);
      }
    }

    function openPreview() {
      const quizObj = buildQuizObject();
      if (!quizObj) return;

      const fieldsArr = JSON.parse(quizObj.fields);

      let html = `<h3>${escapeHTML(quizObj.title)} <span class="badge">${escapeHTML(quizObj.category)}</span></h3>`;
      if (quizObj.description) html += `<p style="color:#64748b; margin-bottom:1rem;">${escapeHTML(quizObj.description)}</p>`;

      fieldsArr.forEach((f, idx) => {
        html += `<div class="card" style="background:#f8fafc; padding:1rem;">
          <p><b>${idx + 1}. ${escapeHTML(f.label)}</b> ${f.required ? '<span style="color:#ef4444;">*</span>' : '<span style="color:#64748b; font-size:12px;">(Optional)</span>'}</p>`;

        if (f.type === 'text') html += `<input type="text" disabled placeholder="Short answer text">`;
        else if (f.type === 'paragraph') html += `<textarea disabled placeholder="Long paragraph answer"></textarea>`;
        else if (f.type === 'number') html += `<input type="number" disabled placeholder="0">`;
        else if (f.type === 'mcq' || f.type === 'rating') {
          f.options.forEach(o => {
            html += `<label class="option-label" style="display:block; margin-top:4px;"><input type="radio" disabled> ${escapeHTML(f.type === 'rating' ? o + ' ★' : o)}</label>`;
          });
        } else if (f.type === 'checkbox') {
          f.options.forEach(o => {
            html += `<label class="option-label" style="display:block; margin-top:4px;"><input type="checkbox" disabled> ${escapeHTML(o)}</label>`;
          });
        }
        html += `</div>`;
      });

      document.getElementById('previewContent').innerHTML = html;
      document.getElementById('previewModal').style.display = 'block';
    }

    function closePreview() {
      document.getElementById('previewModal').style.display = 'none';
    }

    function escapeHTML(str) {
      return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    function escapeAttr(str) {
      return String(str).replace(/"/g, '&quot;');
    }

    init();
  </script>
</body>
</html>
