<script>
    const SHEETDB_URL = 'https://sheetdb.io/api/v1/q8x7kiy49blc5';
    const params = new URLSearchParams(window.location.search);
    const editQuizId = params.get('id') ? Number(params.get('id')) : null;
    let uidCounter = 0;

    async function init() {
      if (editQuizId) {
        try {
          const res = await fetch(`${SHEETDB_URL}?sheet=quizzes`);
          const data = await res.json();
          const existing = Array.isArray(data) ? data.find(q => Number(q.id) === Number(editQuizId)) : null;
          
          if (existing) {
            if (existing.password) {
              const pwd = prompt("Enter password to edit this quiz:");
              if (pwd !== existing.password) {
                alert("Incorrect password!");
                window.location.href = "index.html";
                return;
              }
            }

            document.getElementById('studioHeading').innerText = 'Edit Quiz Studio';
            document.getElementById('saveBtnText').innerText = 'Save Changes';
            
            document.getElementById('quizTitle').value = existing.title || '';
            document.getElementById('quizCategory').value = existing.category || 'General';
            document.getElementById('quizDesc').value = existing.description || '';
            document.getElementById('quizPassword').value = existing.password || '';
            
            const parsedFields = existing.fields ? JSON.parse(existing.fields) : [];
            if (Array.isArray(parsedFields) && parsedFields.length > 0) {
              parsedFields.forEach(f => addField(f));
            } else {
              addField();
            }
          } else {
            alert('Quiz not found for editing.');
            window.location.href = 'index.html';
          }
        } catch (e) {
          console.error('Error loading quiz:', e);
          alert('Could not load quiz from cloud.');
          window.location.href = 'index.html';
        }
      } else {
        addField({ label: 'Full Name', type: 'text', required: true, options: [] });
        addField({ label: 'Overall Rating', type: 'rating', required: true, options: ['1','2','3','4','5'] });
      }
    }
    // ... rest of create.html script remains identical ...
</script>
