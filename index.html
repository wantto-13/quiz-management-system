<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Management System - Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .filter-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-bar input, .filter-bar select {
      margin: 0;
    }
    .quiz-card {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-left: 5px solid #4f46e5;
      border-radius: 14px;
      padding: 1.4rem 1.6rem;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
      transition: all 0.2s ease;
    }
    .quiz-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      border-color: #cbd5e1;
    }
    .quiz-meta {
      flex: 1;
      min-width: 240px;
    }
    .quiz-desc {
      color: #64748b;
      font-size: 0.88rem;
      margin: 4px 0 8px;
    }
    .cat-pill {
      display: inline-block;
      background: #f1f5f9;
      color: #334155;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 9px;
      border-radius: 6px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .action-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .action-group .btn {
      margin: 0;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.25s ease;
      z-index: 300;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="brand">⚡ Quiz Management System</a>
    <a href="create.html" class="btn-create">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      Create New Quiz
    </a>
  </nav>

  <div class="container">
    <div class="hero-header">
      <div>
        <h1>Workspace Dashboard</h1>
        <p>Manage quizzes, share forms, and export structured CSV database tables.</p>
      </div>
      <div class="filter-bar">
        <select id="categoryFilter" onchange="renderDashboard()" style="width: 175px;">
          <option value="ALL">All Categories</option>
          <option value="General">General</option>
          <option value="Academic Quiz">Academic Quiz</option>
          <option value="Data Survey">Data Survey</option>
          <option value="Event Registration">Event Registration</option>
          <option value="Feedback">Feedback</option>
        </select>
        <input type="text" id="searchInput" placeholder="🔍 Search quizzes..." onkeyup="renderDashboard()" style="width: 220px;">
      </div>
    </div>

    <!-- Live Summary Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Active Quizzes</div>
        <div class="stat-value" id="statQuizzes">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Rows Collected</div>
        <div class="stat-value" id="statRows" style="color: #10b981;">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Columns Defined</div>
        <div class="stat-value" id="statCols" style="color: #0ea5e9;">0</div>
      </div>
    </div>

    <!-- Quiz List Container -->
    <div id="quizList"></div>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="toast">Link copied to clipboard!</div>

  <script>
    function safeGetJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (err) {
        console.error(`Storage read error for ${key}:`, err);
        return fallback;
      }
    }

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    async function copyQuizLink(quizId) {
      const quizzes = safeGetJSON('qms_quizzes', []);
      const quiz = quizzes.find(q => q.id === quizId);
      if (!quiz) return alert('Quiz not found!');

      try {
        const jsonStr = JSON.stringify(quiz);
        const encoded = btoa(encodeURIComponent(jsonStr));
        const longUrl = new URL(`take.html?quiz=${encoded}`, window.location.href).href;

        showToast('⏳ Generating clean short link...');

        // Automatically shorten via free TinyURL API
        const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
        const shortUrl = await response.text();

        // Fallback to long URL if offline or API fails
        const finalUrl = (shortUrl && shortUrl.startsWith('http')) ? shortUrl : longUrl;

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(finalUrl)
            .then(() => showToast('✅ Clean short link copied!'))
            .catch(() => prompt('Copy this quiz link:', finalUrl));
        } else {
          prompt('Copy this quiz link:', finalUrl);
        }
      } catch (err) {
        console.error('Error generating link:', err);
        alert('Could not generate share link.');
      }
    }

    function secureEdit(quizId) {
      const quizzes = safeGetJSON('qms_quizzes', []);
      const quiz = quizzes.find(q => q.id === quizId);
      if (!quiz) return;

      if (quiz.password) {
        const pwd = prompt("Enter password to edit this quiz:");
        if (pwd !== quiz.password) {
          return alert("Incorrect password!");
        }
      }
      window.location.href = `create.html?id=${quizId}`;
    }

    function secureExport(quizId) {
      const quizzes = safeGetJSON('qms_quizzes', []);
      const quiz = quizzes.find(q => q.id === quizId);
      if (!quiz) return;

      if (quiz.password) {
        const pwd = prompt("Enter password to view Table & CSV:");
        if (pwd !== quiz.password) {
          return alert("Incorrect password!");
        }
      }
      window.location.href = `export.html?id=${quizId}`;
    }

    function renderDashboard() {
      const quizzes = safeGetJSON('qms_quizzes', []);
      const allRecords = safeGetJSON('qms_records', {});
      const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
      const selectedCategory = document.getElementById
