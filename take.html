<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Take Quiz - QMS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <span class="brand">⚡ Quiz Management System</span>
  </nav>

  <div class="container">
    <div class="card" id="quizCardContainer" style="border-top: 5px solid #4f46e5;">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
        <h2 id="quizTitle" style="margin:0;">Loading Quiz...</h2>
        <span id="quizCat" class="badge">General</span>
      </div>
      <p id="quizDesc" style="color:#64748b; margin-top:8px; margin-bottom:1.2rem;"></p>

      <form id="quizForm">
        <div id="questionsList"></div>
        <button type="submit" class="btn-create" style="margin-top:10px;">Submit Response</button>
      </form>
    </div>

    <div id="thankYouCard" class="card" style="display:none; text-align:center; padding: 4rem 2rem; border-top: 5px solid #10b981;">
      <div style="font-size: 3rem; margin-bottom: 1rem;">🎉</div>
      <h2>Thank You!</h2>
      <p style="margin: 0.5rem 0 1.5rem;">Your response has been successfully recorded.</p>
      <button onclick="window.location.reload()" class="btn btn-secondary">Submit Another Response</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const quizId = Number(params.get('id'));
    const quizzes = JSON.parse(localStorage.getItem('qms_quizzes')) || [];
    const quiz = quizzes.find(q => q.id === quizId);

    function loadQuiz() {
      if (!quiz) {
        document.getElementById('quizTitle').innerText = 'Quiz not found!';
        document.getElementById('quizForm').style.display = 'none';
        return;
      }

      document.getElementById('quizTitle').innerText = quiz.title;
      document.getElementById('quizCat').innerText = quiz.category || 'General';
      document.getElementById('quizDesc').innerText = quiz.description || '';

      const container = document.getElementById('questionsList');
      quiz.fields.forEach((field, idx) => {
        const box = document.createElement('div');
        box.className = 'card';
        box.style.background = '#f8fafc';
        const reqAttr = field.required !== false ? 'required' : '';
        const reqMark = field.required !== false ? '<span style="color:#ef4444;">*</span>' : '<span style="color:#64748b; font-size:12px;">(Optional)</span>';

        let inputHTML = '';
        if (field.type === 'text') {
          inputHTML = `<input type="text" name="col_${idx}" placeholder="Enter answer..." ${reqAttr}>`;
        } else if (field.type === 'paragraph') {
          inputHTML = `<textarea name="col_${idx}" rows="3" placeholder="Write response..." ${reqAttr}></textarea>`;
        } else if (field.type === 'number') {
          inputHTML = `<input type="number" step="any" name="col_${idx}" placeholder="Enter number..." ${reqAttr}>`;
        } else if (field.type === 'checkbox') {
          (field.options || []).forEach(opt => {
            inputHTML += `<label style="display:block; margin-top:6px; cursor:pointer;"><input type="checkbox" name="col_${idx}" value="${opt}" style="width:16px; height:16px; margin-right:8px;"> ${opt}</label>`;
          });
        } else {
          (field.options || []).forEach(opt => {
            const display = field.type === 'rating' ? `${opt} ★` : opt;
            inputHTML += `<label style="display:block; margin-top:6px; cursor:pointer;"><input type="radio" name="col_${idx}" value="${opt}" ${reqAttr} style="margin-right:8px;"> ${display}</label>`;
          });
        }

        box.innerHTML = `<p><b>${idx + 1}. ${field.label}</b> ${reqMark}</p>${inputHTML}`;
        container.appendChild(box);
      });
    }

    document.getElementById('quizForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const rowValues = [];

      for (let idx = 0; idx < quiz.fields.length; idx++) {
        const field = quiz.fields[idx];
        if (field.type === 'checkbox') {
          const checked = Array.from(document.querySelectorAll(`input[name="col_${idx}"]:checked`)).map(el => el.value);
          if (field.required !== false && checked.length === 0) return alert(`Please answer "${field.label}".`);
          rowValues.push(checked.join('; '));
        } else if (field.type === 'text' || field.type === 'paragraph' || field.type === 'number') {
          rowValues.push(document.querySelector(`[name="col_${idx}"]`).value.trim());
        } else {
          const checked = document.querySelector(`input[name="col_${idx}"]:checked`);
          rowValues.push(checked ? checked.value : '');
        }
      }

      const records = JSON.parse(localStorage.getItem('qms_records')) || [];
      records.push({
        id: Date.now(),
        quiz_id: quiz.id,
        timestamp: new Date().toLocaleString(),
        values: rowValues
      });
      localStorage.setItem('qms_records', JSON.stringify(records));

      document.getElementById('quizCardContainer').style.display = 'none';
      document.getElementById('thankYouCard').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    loadQuiz();
  </script>
</body>
</html>
