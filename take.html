<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Take Quiz - Quiz Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Minimalist Navbar for Shared Links -->
  <nav>
    <span class="brand">⚡ Quiz Management System</span>
  </nav>

  <div class="container">
    <div class="card" id="quizCardContainer" style="border-top: 5px solid #4f46e5;">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
        <h2 id="quizTitle" style="margin:0;">Loading...</h2>
        <span id="quizCat" class="badge">General</span>
      </div>
      <p id="quizDesc" style="color:#64748b; margin-top:8px; margin-bottom:1.2rem;"></p>

      <form id="quizForm">
        <div id="questionsList"></div>
        <button type="submit" class="btn-create" style="margin-top:10px;">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width:18px; height:18px; display:inline-block; vertical-align:middle; margin-right:4px;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
          Submit Response
        </button>
      </form>
    </div>

    <!-- Thank You Success Card (Hidden until submission) -->
    <div id="thankYouCard" class="card" style="display:none; text-align:center; padding: 4rem 2rem; border-top: 5px solid #10b981;">
      <div style="font-size: 3rem; margin-bottom: 1rem;">🎉</div>
      <h2 style="color: #0f172a; margin-bottom: 0.5rem;">Thank You!</h2>
      <p style="color: #64748b; font-size: 1.05rem; margin-bottom: 1.5rem;">Your response has been successfully recorded in the cloud.</p>
      <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
        <button onclick="window.location.reload()" class="btn btn-secondary">Submit Another Response</button>
        <a href="index.html" class="btn btn-primary">← Back to Dashboard</a>
      </div>
    </div>
  </div>

  <script>
    const SHEETDB_URL = 'https://sheetdb.io/api/v1/q8x7kiy49blc5';
    const params = new URLSearchParams(window.location.search);
    const quizId = params.get('id') ? Number(params.get('id')) : null;

    let quiz = null;

    async function loadQuizFromCloud() {
      if (!quizId) {
        document.getElementById('quizTitle').innerText = 'Invalid Quiz Link';
        document.getElementById('quizCat').style.display = 'none';
        document.getElementById('quizForm').style.display = 'none';
        return;
      }

      try {
        const res = await fetch(`${SHEETDB_URL}?sheet=quizzes`);
        const data = await res.json();
        const quizObj = Array.isArray(data) ? data.find(q => Number(q.id) === Number(quizId)) : null;
        
        if (!quizObj) {
          document.getElementById('quizTitle').innerText = 'Quiz not found!';
          document.getElementById('quizCat').style.display = 'none';
          document.getElementById('quizForm').style.display = 'none';
          return;
        }

        quiz = quizObj;
        quiz.fields = quiz.fields ? JSON.parse(quiz.fields) : [];

        document.getElementById('quizTitle').innerText = quiz.title;
        document.getElementById('quizCat').innerText = quiz.category || 'General';
        document.getElementById('quizDesc').innerText = quiz.description || '';

        const container = document.getElementById('questionsList');

        quiz.fields.forEach((field, idx) => {
          const box = document.createElement('div');
          box.className = 'card';
          box.style.background = '#f8fafc';
          const reqAttr = field.required !== false ? 'required' : '';
          const reqMark = field.required !== false
            ? '<span style="color:#ef4444;">*</span>'
            : '<span style="color:#64748b; font-size:12px;">(Optional)</span>';

          let inputHTML = '';
          if (field.type === 'text') {
            inputHTML = `<input type="text" name="col_${idx}" placeholder="Enter your answer..." ${reqAttr}>`;
          } else if (field.type === 'paragraph') {
            inputHTML = `<textarea name="col_${idx}" rows="3" style="width:100%; padding:10px; border-radius:9px; border:1.5px solid #e2e8f0; margin-top:6px;" placeholder="Write detailed response..." ${reqAttr}></textarea>`;
          } else if (field.type === 'number') {
            inputHTML = `<input type="number" step="any" name="col_${idx}" placeholder="Enter a number..." ${reqAttr}>`;
          } else if (field.type === 'checkbox') {
            (field.options || []).forEach(opt => {
              inputHTML += `
                <label class="option-label" style="display:block; margin-top:6px; cursor:pointer;">
                  <input type="checkbox" name="col_${idx}" value="${escapeAttr(opt)}" style="accent-color:#4f46e5; width:16px; height:16px; margin-right:8px;"> ${escapeHTML(opt)}
                </label>`;
            });
          } else {
            (field.options || []).forEach(opt => {
              const display = field.type === 'rating' ? `${escapeHTML(opt)} ★` : escapeHTML(opt);
              inputHTML += `
                <label class="option-label" style="display:block; margin-top:6px; cursor:pointer;">
                  <input type="radio" name="col_${idx}" value="${escapeAttr(opt)}" ${reqAttr} style="margin-right:8px;"> ${display}
                </label>`;
            });
          }

          box.innerHTML = `<p><b>${idx + 1}. ${escapeHTML(field.label)}</b> ${reqMark}</p>${inputHTML}`;
          container.appendChild(box);
        });

      } catch (err) {
        console.error('Failed to load quiz from Google Sheet:', err);
        document.getElementById('quizTitle').innerText = 'Error loading quiz from cloud.';
        document.getElementById('quizForm').style.display = 'none';
      }
    }

    document.getElementById('quizForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!quiz) return;

      const rowValues = [];
      for (let idx = 0; idx < quiz.fields.length; idx++) {
        const field = quiz.fields[idx];
        const isReq = field.required !== false;

        if (field.type === 'text' || field.type === 'paragraph' || field.type === 'number') {
          const val = document.querySelector(`[name="col_${idx}"]`).value.trim();
          rowValues.push(val);
        } else if (field.type === 'checkbox') {
          const checked = Array.from(document.querySelectorAll(`input[name="col_${idx}"]:checked`)).map(el => el.value);
          if (isReq && checked.length === 0) {
            return alert(`Please select at least one option for "${field.label}".`);
          }
          rowValues.push(checked.join('; '));
        } else {
          const checked = document.querySelector(`input[name="col_${idx}"]:checked`);
          rowValues.push(checked ? checked.value : '');
        }
      }

      const recordData = {
        id: Date.now(),
        quiz_id: quiz.id,
        timestamp: new Date().toLocaleString(),
        values: JSON.stringify(rowValues)
      };

      try {
        const res = await fetch(`${SHEETDB_URL}?sheet=records`, {
          method: 'POST',
          headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: recordData })
        });

        if (!res.ok) throw new Error('Server response failed');

        document.getElementById('quizCardContainer').style.display = 'none';
        document.getElementById('thankYouCard').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        alert('Error submitting response to Google Sheet: ' + err.message);
      }
    });

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function escapeAttr(str) {
      return String(str || '').replace(/"/g, '&quot;');
    }

    loadQuizFromCloud();
  </script>
</body>
</html>
